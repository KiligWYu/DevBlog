  var html = document.documentElement;
  var toggle = document.querySelector('.darkmode-toggle');
  var themeColor = document.getElementById('theme-color');
  var prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)');

  if (!toggle) return;

  function isDark() {
    return html.dataset.dark === 'true';
  }

  function updateTheme(enabled, persist) {
    html.dataset.dark = String(enabled);
    themeColor.setAttribute('content', enabled ? '#181a1b' : '#f8f6f2');
    toggle.setAttribute('aria-label', enabled ? '切换到浅色模式' : '切换到深色模式');
    toggle.setAttribute('title', enabled ? '切换到浅色模式' : '切换到深色模式');

    if (persist) {
      try {
        localStorage.setItem('dark', String(enabled));
      } catch (error) {}
    }
  }

  toggle.addEventListener('click', function () {
    updateTheme(!isDark(), true);
  });

  if (prefersDarkMode.addEventListener) {
    prefersDarkMode.addEventListener('change', function (event) {
      var hasStoredPreference = false;
      try {
        hasStoredPreference = localStorage.getItem('dark') !== null;
      } catch (error) {}
      if (!hasStoredPreference) updateTheme(event.matches, false);
    });
  }

  updateTheme(isDark(), false);
}());</script></div></body></html>
